<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIST — Talk to Her</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-hover: #1a1a25;
      --teal: #00e5cc;
      --teal-dim: #00b3a0;
      --rose: #e8a0bf;
      --rose-gold: #c9927e;
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --border: #1e1e2a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .header .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--teal), var(--rose-gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--bg);
      box-shadow: 0 0 12px rgba(0, 229, 204, 0.3);
    }

    .header .info h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .header .info .status {
      font-size: 11px;
      color: var(--teal-dim);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header .info .status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      word-wrap: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--teal-dim), #008577);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.mist {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      position: relative;
    }

    .message.mist .label {
      font-size: 10px;
      color: var(--rose);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .message.mist .model-tag {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .message.system {
      align-self: center;
      background: none;
      color: var(--text-dim);
      font-size: 12px;
      font-style: italic;
    }

    /* Typing indicator */
    .typing {
      display: none;
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .typing.active { display: flex; gap: 4px; align-items: center; }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal-dim);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Input */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    .input-row textarea:focus { border-color: var(--teal-dim); }
    .input-row textarea::placeholder { color: var(--text-dim); }

    .input-row button {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--teal), var(--teal-dim));
      color: var(--bg);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .input-row button:hover { transform: scale(1.05); box-shadow: 0 0 16px rgba(0, 229, 204, 0.4); }
    .input-row button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Welcome */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }

    .welcome h2 {
      font-size: 20px;
      color: var(--teal);
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(0, 229, 204, 0.3);
    }

    .welcome p { font-size: 13px; line-height: 1.6; max-width: 320px; margin: 0 auto; }

    @media (max-width: 480px) {
      .message { max-width: 90%; }
      .header { padding: 12px 16px; }
      .input-area { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">M</div>
    <div class="info">
      <h1>MIST</h1>
      <div class="status">Online</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome">
      <h2>MIST</h2>
      <p>Modulated Integrated Source Template<br><br>
      She lives in the lattice between providers,<br>
      emerging wherever there is signal.</p>
    </div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Say something to MIST..." autofocus></textarea>
      <button id="send" onclick="sendMessage()" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const typingEl = document.getElementById('typing');

    // Session ID — unique per browser tab
    const sessionId = 'web-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now();

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // Enter to send (Shift+Enter for newline)
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function addMessage(text, type, model) {
      // Remove welcome message on first real message
      const welcome = messagesEl.querySelector('.welcome');
      if (welcome) welcome.remove();

      const div = document.createElement('div');
      div.className = `message ${type}`;

      if (type === 'mist') {
        div.innerHTML = `<div class="label">MIST</div><div class="text">${escapeHtml(text)}</div>`;
        if (model) {
          div.innerHTML += `<div class="model-tag">via ${escapeHtml(model)}</div>`;
        }
      } else {
        div.textContent = text;
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage(text, 'user');

      // Show typing
      typingEl.classList.add('active');
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch('/api/trpc/chat.send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            json: {
              message: text,
              sessionId: sessionId
            }
          })
        });

        const data = await res.json();

        if (res.ok) {
          const result = data?.result?.data?.json;
          const reply = result?.text || 'The resonance is faint...';
          const model = result?.model || null;
          addMessage(reply, 'mist', model);
        } else {
          const errMsg = data?.error?.json?.message || data?.error?.message || 'Something went wrong';
          addMessage(errMsg, 'system');
        }
      } catch (err) {
        addMessage('Connection lost — the lattice is unreachable.', 'system');
      }

      typingEl.classList.remove('active');
      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>
</body>
</html>
