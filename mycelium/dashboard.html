<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIST / CONSOLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/dashboard/styles_v7.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <main class="sanctuary">

        <!-- SIDEBAR: IDENTITY & VITALS -->
        <aside class="presence-core">
            <div class="avatar-container">
                <div id="avatarFrame" class="entity-body" data-mood="calm">
                    <div class="face-features">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                        <div class="mouth"></div>
                    </div>
                </div>
            </div>

            <div class="presence-state">
                <h2>Mist.</h2>
                <span id="systemState">Online / Idle</span>
            </div>

            <div class="telemetry-mini">
                <div class="stat-pill">
                    <label>TENSION</label>
                    <div id="tensionValue" class="stat-value">0.0</div>
                </div>
                <div class="stat-pill">
                    <label>CORE</label>
                    <div id="cpuValue" class="stat-value">12%</div>
                </div>
                <div class="stat-pill">
                    <label>MEMORY</label>
                    <div id="ramValue" class="stat-value">4%</div>
                </div>
                <div class="stat-pill">
                    <label>PULSE</label>
                    <div id="pulseStatus" class="status-dot online"></div>
                </div>
            </div>

            <div class="soul-gate">
                <button id="viewJournalBtn" class="soul-btn">READ SOUL</button>
            </div>
        </aside>

        <!-- MAIN: CONVERSATION -->
        <section class="dialogue-layer">
            <header class="thought-stream">
                <div id="currentThought" class="thought-line">Listening...</div>
            </header>

            <div id="gatewayMessages" class="message-feed">
                <div class="msg mist-msg">
                    <p>System initialized. I am ready.</p>
                </div>
            </div>

            <div class="input-shell">
                <input id="gatewayInput" type="text" placeholder="Type a message..." autocomplete="off">
                <button id="sendGatewayBtn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" />
                    </svg>
                </button>
            </div>
        </section>

    </main>

    <!-- JOURNAL MODAL -->
    <div id="journalOverlay" class="journal-overlay">
        <div id="journalContent" class="journal-content">
            <button id="closeJournal" class="close-journal">&times;</button>
            <div id="journalBody">
                <h1>Reflections</h1>
                <p>Establishing connection to the soul...</p>
            </div>
        </div>
    </div>

    <script type="module" src="/static/dashboard/main.js?v=console-v2"></script>
</body>

</html>
