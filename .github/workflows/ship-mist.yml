name: MIST Sovereign Ship
# Triggered on push to main
# Railway deploys automatically via its built-in GitHub integration
# (push to main → Railway webhook → both elegant-essence + daring-respect redeploy)
# This workflow handles: test validation + Docker image build verification
#
# Optional secrets (set in repo Settings > Secrets > Actions):
#   EAS_TOKEN      — expo.dev > Account Settings > Access Tokens (mobile builds)
#   GEMINI_API_KEY — Gemini API key (gateway only, never frontend)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Gateway — test + docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r api/server/requirements.txt pytest

      - name: Run gateway tests (unit only, skip integration)
        run: |
          if [ -d api/tests ]; then
            pytest api/tests/ -v --tb=short -m "not integration"
          else
            echo "No api/tests/ yet — skipping"
          fi
        env:
          PYTHONPATH: .
          SQLITE_PATH: /tmp/test-mist.db

      - name: Build Docker image (verify Dockerfile.mist is valid)
        run: docker build -f Dockerfile.mist -t mist-gateway .

      # Railway autodeploys on push via GitHub integration — no step needed here

  mobile:
    name: Mobile — EAS build (iOS)
    runs-on: ubuntu-latest
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install mobile deps
        run: |
          if [ -f app/package.json ]; then
            cd app && npm ci
          else
            echo "No app/ directory yet — skipping"
          fi

      - name: Setup Expo EAS
        if: env.EAS_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: EAS build — iOS production
        if: env.EAS_TOKEN != ''
        run: |
          if [ -f app/package.json ]; then
            cd app && npx eas build --platform ios --profile production --non-interactive
          else
            echo "No app/ directory yet — skipping"
          fi
