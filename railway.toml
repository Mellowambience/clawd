# Railway deployment config for MIST Python gateway
# Required env vars in Railway dashboard:
#   GEMINI_API_KEY, JWT_SECRET, NODE_ENV=production

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn gateway.server:app --host 0.0.0.0 --port ${PORT:-18789}'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
internalPort = 18789
